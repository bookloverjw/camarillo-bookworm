# Keeps list prices and Coming Soon current from ISBNdb.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   ISBNDB_API_KEY       isbndb.com > account > API key
#   SUPABASE_SECRET_KEY  Supabase dashboard > Settings > API > Secret keys
# and supabase/isbndb-prices-and-coming-soon.sql applied to the database.
#
# Runs on a schedule and never on pull requests, so the secrets are never
# exposed to code from outside the repository. Run it by hand from the
# Actions tab ("Run workflow"), optionally as a dry run.
name: ISBNdb refresh

on:
  schedule:
    - cron: '17 10 * * *'   # daily, ~3am Pacific: list prices (a slice of the catalogue each day)
    - cron: '47 10 * * 1'   # Mondays: Coming Soon
  workflow_dispatch:
    inputs:
      job:
        description: Which to run
        type: choice
        options: [both, list-prices, coming-soon]
        default: both
      dry_run:
        description: Look without writing anything
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  list-prices:
    if: >-
      github.event.schedule == '17 10 * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.job != 'coming-soon')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh list prices
        env:
          ISBNDB_API_KEY: ${{ secrets.ISBNDB_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/isbndb/refresh-list-prices.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Keep the price-change report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-changes-${{ github.run_id }}
          path: price-changes.csv
          if-no-files-found: ignore
          retention-days: 90

  coming-soon:
    if: >-
      github.event.schedule == '47 10 * * 1' ||
      (github.event_name == 'workflow_dispatch' && inputs.job != 'list-prices')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh Coming Soon
        env:
          ISBNDB_API_KEY: ${{ secrets.ISBNDB_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/isbndb/refresh-coming-soon.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
